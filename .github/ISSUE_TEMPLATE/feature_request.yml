name: Feature request
description: Suggest an improvement to AWS Role Hop
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        AWS Role Hop deliberately requests only the `storage` permission and ships no
        telemetry, backend, or remotely hosted code. Proposals that require new
        browser permissions or network access need an explicit design discussion.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The workflow that is awkward today. Describe the need, not the implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true

  - type: dropdown
    id: permissions
    attributes:
      label: Would this need new browser permissions or network access?
      options:
        - 'No'
        - 'Yes'
        - Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
