name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach packages to
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source and browser builds
        run: npm run check

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate the Firefox add-on package
        run: npx web-ext lint --source-dir .output/firefox-mv3

      - name: Build store packages
        run: npm run zip:chrome && npm run zip:edge && npm run zip:firefox

      - name: Generate package checksums
        working-directory: .output
        run: sha256sum *.zip | sort -k2 > SHA256SUMS

      - name: Verify the tag matches the manifest version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          manifest_version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "v${manifest_version}" ]; then
            echo "Tag ${tag} does not match package version v${manifest_version}." >&2
            exit 1
          fi

      - name: Extract release notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            /^## \[/ { if (found) exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "No changelog entry found for ${TAG}." >&2
            exit 1
          fi
          printf '\n---\n\nCreated and maintained by [Faruk AK](https://github.com/farukak).\n' >> RELEASE_NOTES.md

      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "AWS Role Hop ${TAG}" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" --verify-tag --title "AWS Role Hop ${TAG}" --notes-file RELEASE_NOTES.md --draft
          fi
          gh release upload "$TAG" .output/*.zip .output/SHA256SUMS --clobber
